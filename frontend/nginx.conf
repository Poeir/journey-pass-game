server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 1024;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  # Service worker, registration shim, and PWA manifest must NEVER be cached
  # by browsers/proxies — otherwise users get stuck on the previous SW build
  # and stop receiving updates entirely.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
    try_files $uri =404;
  }

  location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    expires off;
    try_files $uri =404;
  }

  # index.html is the entry point that points at hashed JS/CSS bundles.
  # It must revalidate every load, otherwise a stale index.html will keep
  # pointing at old bundle hashes long after a deploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
    expires off;
    try_files $uri =404;
  }

  location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    expires off;
    try_files $uri $uri/ /index.html;
  }
}
